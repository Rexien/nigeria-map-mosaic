<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nigeria Mosaic — Event Word Submission</title>
  <meta name="description" content="Submit a single word to be rendered live on the Nigeria Mosaic screen.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Mobile Styles -->
  <link rel="stylesheet" href="css/submit.css">
</head>
<body>

  <div class="mobile-container">
    <!-- Header Badge -->
    <div class="event-header-badge">
      <span class="badge-dot"></span>
      <span>Nigeria Mosaic</span>
    </div>

    <!-- Main Card -->
    <div class="submit-card">
      
      <!-- Submission Form State -->
      <div id="form-card-body" style="display: flex; flex-direction: column; gap: 16px;">
        <h1 class="question-title" id="question-title">What single word represents Nigeria's future to you?</h1>
        <p class="question-hint" id="question-subtitle">Enter a single powerful word</p>

        <form id="word-form" class="submit-form" novalidate>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="word-input" 
              class="word-input" 
              placeholder="e.g. Resilience" 
              autocomplete="off" 
              autocorrect="off" 
              autocapitalize="words" 
              spellcheck="false" 
              required
            >
            <span class="char-counter" id="char-counter">0/20</span>
          </div>

          <!-- Space / Length / Format Error Notice -->
          <div class="validation-message" id="error-msg"></div>

          <button type="submit" id="btn-submit" class="btn-submit">
            <span id="btn-text">Send to Big Screen</span>
            <div class="btn-spinner" id="btn-spinner"></div>
          </button>
        </form>
      </div>

      <!-- Thank You / Success State (Hidden by default) -->
      <div class="success-view" id="success-view">
        <div class="success-icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>

        <h2 class="success-title">Thank You!</h2>
        <div class="submitted-word-pill" id="submitted-word-display">"Resilience"</div>
        <p class="success-message">
          Your word has been sent. Watch the big screen as it appears live inside the map of Nigeria!
        </p>

        <button type="button" id="btn-submit-another" class="btn-secondary">
          Submit Another Word
        </button>
      </div>

    </div>

    <p class="footer-text">
      Live corporate event interactive display.<br>One word per submission.
    </p>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="lib/supabase.min.js"></script>
  <script src="js/stemmer.js"></script>
  <script src="js/profanity.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/submit.js"></script>
</body>
</html>
