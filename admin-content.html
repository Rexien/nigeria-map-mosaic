<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit questions — NIAC Live</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="stylesheet" href="/css/app.css"></head>
<body data-page="question-bank"><div class="shell-bar"></div><header class="site-header"><a class="brand" href="/admin"><span class="brand-mark" aria-hidden="true"></span><span>NIAC Live<small>Question editor</small></span></a><div class="header-links"><a href="/admin">Back to event control</a><a class="button compact" href="/display" target="_blank">Open big screen</a></div></header>
<main class="page admin-page"><div class="admin-page-heading"><div><p class="eyebrow">Question bank</p><h1>Edit questions</h1><p>Change the wording, four options, correct answer, timing and explanation here.</p></div><div class="live-summary"><span>Question count</span><strong id="question-count">—</strong></div></div>
  <section class="question-tools"><div class="field"><label for="question-search">Find a question</label><input id="question-search" type="search" placeholder="Search by words or category"></div><label class="field"><span>Show</span><select id="question-status-filter"><option value="all">All questions</option><option value="approved">Ready to use</option><option value="reviewed">Reviewed</option><option value="requires_fact_check">Needs fact check</option></select></label></section>
  <p id="content-message" class="status-message" aria-live="polite"></p><section id="question-list" class="question-list"></section>
</main>
<dialog id="question-editor" class="question-dialog"><form id="question-form" method="dialog"><div class="dialog-heading"><div><p class="eyebrow" id="editor-category">Question</p><h2>Edit question</h2></div><button type="button" class="icon-button" id="close-question-editor" aria-label="Close editor">×</button></div><input type="hidden" id="editor-id"><div class="field"><label for="editor-question">Question shown to players</label><textarea id="editor-question" rows="3" maxlength="500" required></textarea></div><fieldset class="option-editor"><legend>Answer options</legend><p class="muted">Select the circle beside the correct answer.</p><label><input type="radio" name="correct-option" value="0" required><span>A</span><input id="editor-option-0" maxlength="180" required aria-label="Answer option A"></label><label><input type="radio" name="correct-option" value="1"><span>B</span><input id="editor-option-1" maxlength="180" required aria-label="Answer option B"></label><label><input type="radio" name="correct-option" value="2"><span>C</span><input id="editor-option-2" maxlength="180" required aria-label="Answer option C"></label><label><input type="radio" name="correct-option" value="3"><span>D</span><input id="editor-option-3" maxlength="180" required aria-label="Answer option D"></label></fieldset><div class="editor-grid"><div class="field"><label for="editor-duration">Answer time in seconds</label><input id="editor-duration" type="number" min="5" max="120" required></div><div class="field"><label for="editor-status">Review status</label><select id="editor-status"><option value="requires_fact_check">Needs fact check</option><option value="reviewed">Reviewed</option><option value="approved">Ready to use</option></select></div></div><fieldset class="media-editor"><legend>Photograph (optional)</legend><div class="editor-grid"><div class="field"><label for="editor-media-src">Image file / URL</label><input id="editor-media-src" placeholder="/assets/trivia/01.jpg"></div><div class="field"><label for="editor-media-timing">Display timing</label><select id="editor-media-timing"><option value="">No photograph</option><option value="question">During question &amp; reveal</option><option value="reveal">Only on answer reveal</option></select></div></div><div class="field"><label for="editor-media-alt">Neutral description (alt text)</label><input id="editor-media-alt" placeholder="Do not name the answer or give clues away"></div><div class="field"><label for="editor-media-caption">Answer reveal caption</label><input id="editor-media-caption" placeholder="Shown with the answer"></div><div class="editor-grid"><div class="field"><label for="editor-media-author">Author / Photographer</label><input id="editor-media-author" placeholder="e.g. Kaizenify"></div><div class="field"><label for="editor-media-license">License</label><input id="editor-media-license" placeholder="e.g. CC BY-SA 4.0"></div></div><div class="field"><label for="editor-media-fallback">Fallback clue if image fails</label><textarea id="editor-media-fallback" rows="2" placeholder="Descriptive text clue for accessibility and low bandwidth"></textarea></div></fieldset><div class="field"><label for="editor-explanation">Explanation shown after reveal</label><textarea id="editor-explanation" rows="3" maxlength="1000" required></textarea></div><div class="field"><label for="editor-source">Fact-check source</label><input id="editor-source" maxlength="1000" required placeholder="Paste a reliable source or describe the reference"></div><p id="editor-message" class="status-message" aria-live="polite"></p><div class="dialog-actions"><button type="button" class="button secondary" id="cancel-question-editor">Cancel</button><button type="submit" class="button" id="save-question">Save question</button></div></form></dialog>
<script src="/config.js"></script><script src="/lib/supabase.min.js"></script><script src="/js/niac-api.js"></script><script src="/js/admin-console.js"></script></body></html>
