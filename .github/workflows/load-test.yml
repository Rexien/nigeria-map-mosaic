name: NIAC Live Cloud Load Runner

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Participant scale tier'
        required: true
        type: choice
        default: '5'
        options:
          - '5'
          - '10'
          - '50'
          - '100'
          - '250'
          - '500'
          - '750'
          - '1000'
      rounds:
        description: 'Number of distinct quiz rounds'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '3'
      burst_seconds:
        description: 'Answer submission burst window in seconds'
        required: true
        type: number
        default: 5
      duplicate_percent:
        description: 'Percentage of participants submitting duplicate retries'
        required: true
        type: number
        default: 10
      target_url:
        description: 'Target Authority URL (must be Preview unless confirmed)'
        required: true
        type: string
        default: 'https://niaclive-git-codex-load-reliability-zamijudes-projects.vercel.app'
      target_gateway_url:
        description: 'Target Gateway URL'
        required: true
        type: string
        default: 'https://92.4.146.91.sslip.io'
      confirm_production:
        description: 'Must type "I CONFIRM PRODUCTION LOAD" if targeting production'
        required: false
        type: string
        default: ''
      cleanup_mode:
        description: 'Cleanup mode after test completion'
        required: true
        type: choice
        default: 'dry-run'
        options:
          - 'dry-run'
          - 'confirmed-purge'

jobs:
  load-test:
    name: Cloud Load Runner (${{ inputs.tier }} Players)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Production Safety Gate & Target Validation
        run: |
          TARGET_URL="${{ inputs.target_url }}"
          CONFIRM_PROD="${{ inputs.confirm_production }}"
          
          if [[ "$TARGET_URL" == *"niaclive.vercel.app"* ]] && [[ "$TARGET_URL" != *"git-"* ]]; then
            if [[ "$CONFIRM_PROD" != "I CONFIRM PRODUCTION LOAD" ]]; then
              echo "::error::Production target detected without explicit confirmation. Aborting."
              exit 1
            fi
            echo "Production target confirmed by operator."
          else
            echo "Target validated as non-production Preview: $TARGET_URL"
          fi

      - name: Read-Only Preflight Checks
        env:
          NIAC_BASE_URL: ${{ inputs.target_url }}
          NIAC_GATEWAY_URL: ${{ inputs.target_gateway_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node -e "
          import { preflight } from './scripts/load/preflight.mjs';
          const res = await preflight(process.env);
          console.log(JSON.stringify(res, null, 2));
          // Preflight readyForLoad is always false because of manual host checks,
          // so we verify that the network/CORS checks themselves succeeded.
          const failedChecks = res.checks.filter(c => c.status !== 200);
          if (failedChecks.length > 0) {
            console.error('Preflight checks failed:', failedChecks);
            process.exit(1);
          }
          if (res.gatewayHealth?.queueDepth !== 0) {
            console.error('Gateway queue is not empty before test start:', res.gatewayHealth?.queueDepth);
            process.exit(1);
          }
          "

      - name: Prepare Rehearsal Participants
        id: prepare
        env:
          NIAC_BASE_URL: ${{ inputs.target_url }}
          NIAC_GATEWAY_URL: ${{ inputs.target_gateway_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          RUN_ID="cloud-${{ inputs.tier }}p-r${{ github.run_id }}"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Run ID: $RUN_ID"
          
          node scripts/load/prepare.mjs \
            --participants ${{ inputs.tier }} \
            --join-rate 10 \
            --run-id "$RUN_ID"

      - name: Run Calibrated Load Tier
        env:
          NIAC_BASE_URL: ${{ inputs.target_url }}
          NIAC_GATEWAY_URL: ${{ inputs.target_gateway_url }}
          NIAC_RUN_ID: ${{ env.RUN_ID }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/load/run-tier.mjs \
            --participants ${{ inputs.tier }} \
            --rounds ${{ inputs.rounds }} \
            --burst-seconds ${{ inputs.burst_seconds }} \
            --duplicate-percent ${{ inputs.duplicate_percent }} \
            --run-id "$RUN_ID"

      - name: Verify Rehearsal Isolation & Leaderboard Integrity
        env:
          NIAC_BASE_URL: ${{ inputs.target_url }}
          NIAC_RUN_ID: ${{ env.RUN_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/load/verify.mjs --run-id "$RUN_ID"

      - name: Rehearsal Cleanup
        if: always()
        env:
          NIAC_BASE_URL: ${{ inputs.target_url }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          CLEANUP_MODE="${{ inputs.cleanup_mode }}"
          if [[ "$CLEANUP_MODE" == "confirmed-purge" ]]; then
            echo "Executing confirmed rehearsal data cleanup..."
            node scripts/load/cleanup.mjs --confirm "CLEAR REHEARSAL DATA"
          else
            echo "Executing dry-run rehearsal cleanup inspection..."
            node scripts/load/cleanup.mjs --dry-run
          fi

      - name: Sanitize Evidence (Strip Sensitive Tokens & Credentials)
        if: always()
        run: |
          EVIDENCE_DIR="artifacts/load/${{ env.RUN_ID }}"
          if [ -d "$EVIDENCE_DIR" ]; then
            echo "Sanitizing evidence in $EVIDENCE_DIR..."
            if [ -f "$EVIDENCE_DIR/credentials.json" ]; then
              # Redact bearer tokens and signing credentials from manifest before archive
              node -e "
              const fs = require('fs');
              const p = '$EVIDENCE_DIR/credentials.json';
              const d = JSON.parse(fs.readFileSync(p, 'utf8'));
              d.participants = (d.participants || []).map(x => ({
                index: x.index,
                id: x.id,
                alias: x.alias,
                isRehearsal: x.isRehearsal,
                durationMs: x.durationMs
              }));
              fs.writeFileSync('$EVIDENCE_DIR/sanitized-manifest.json', JSON.stringify(d, null, 2));
              fs.unlinkSync(p);
              "
              echo "credentials.json redacted and replaced with sanitized-manifest.json"
            fi
          fi

      - name: Upload Test Evidence Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-evidence-${{ inputs.tier }}p-run-${{ github.run_id }}
          path: artifacts/load/${{ env.RUN_ID }}/
          retention-days: 14
