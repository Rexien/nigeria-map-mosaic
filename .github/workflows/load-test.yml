name: NIAC Live Cloud Load Runner

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Participant scale tier'
        required: true
        type: choice
        default: '5'
        options:
          - '5'
          - '10'
          - '50'
          - '100'
          - '250'
          - '500'
          - '750'
          - '1000'
      rounds:
        description: 'Number of distinct quiz rounds'
        required: true
        type: choice
        default: '1'
        options:
          - '1'
          - '3'
      burst_seconds:
        description: 'Answer submission burst window in seconds'
        required: true
        type: number
        default: 5
      duplicate_percent:
        description: 'Percentage of participants submitting duplicate retries'
        required: true
        type: number
        default: 10

env:
  NIAC_BASE_URL: https://niaclive-git-codex-load-reliability-zamijudes-projects.vercel.app
  NIAC_GATEWAY_URL: https://92.4.146.91.sslip.io
  TEST_TIER: ${{ inputs.tier }}
  TEST_ROUNDS: ${{ inputs.rounds }}
  TEST_BURST_SECONDS: ${{ inputs.burst_seconds }}
  TEST_DUPLICATE_PERCENT: ${{ inputs.duplicate_percent }}

permissions:
  contents: read

concurrency:
  group: niac-cloud-load-test
  cancel-in-progress: false

jobs:
  load-test:
    name: Cloud Load Runner (${{ inputs.tier }} Players)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out reviewed load-test code
        uses: actions/checkout@v4
        with:
          ref: d7fd177a66ea2f0cca3fa2792700f538bfe0c4ec
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the fixed Preview target and test size
        run: |
          test "$NIAC_BASE_URL" = 'https://niaclive-git-codex-load-reliability-zamijudes-projects.vercel.app'
          test "$NIAC_GATEWAY_URL" = 'https://92.4.146.91.sslip.io'
          case "$TEST_TIER" in 5|10|50|100|250|500|750|1000) ;; *) exit 1;; esac
          case "$TEST_ROUNDS" in 1|3) ;; *) exit 1;; esac
          [[ "$TEST_BURST_SECONDS" =~ ^[1-9][0-9]?$ ]] || exit 1
          [[ "$TEST_DUPLICATE_PERCENT" =~ ^(0|[1-9][0-9]?|100)$ ]] || exit 1
          echo "Fixed Preview target and tier $TEST_TIER verified"

      - name: Read-Only Preflight Checks
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node -e "
          import { preflight } from './scripts/load/preflight.mjs';
          const res = await preflight(process.env);
          console.log(JSON.stringify(res, null, 2));
          const failedChecks = res.checks.filter(c => c.status !== 200);
          if (failedChecks.length > 0) {
            console.error('Preflight checks failed:', failedChecks);
            process.exit(1);
          }
          if (res.gatewayHealth?.queueDepth !== 0) {
            console.error('Gateway queue is not empty before test start:', res.gatewayHealth?.queueDepth);
            process.exit(1);
          }
          "

      - name: Prepare Rehearsal Participants
        id: prepare
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          RUN_ID="cloud-${TEST_TIER}p-r${GITHUB_RUN_ID}"
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Run ID: $RUN_ID"
          
          node scripts/load/prepare.mjs \
            --participants "$TEST_TIER" \
            --join-rate 10 \
            --run-id "$RUN_ID"

      - name: Run Calibrated Load Tier
        env:
          NIAC_RUN_ID: ${{ env.RUN_ID }}
          ADMIN_PIN: ${{ secrets.ADMIN_PIN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/load/run-tier.mjs \
            --participants "$TEST_TIER" \
            --rounds "$TEST_ROUNDS" \
            --burst-seconds "$TEST_BURST_SECONDS" \
            --duplicate-percent "$TEST_DUPLICATE_PERCENT" \
            --fanout-abort-ms 3000 \
            --run-id "$RUN_ID"

      - name: Verify Rehearsal Isolation & Leaderboard Integrity
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          NIAC_RUN_ID: ${{ env.RUN_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          node scripts/load/verify.mjs --run-id "$RUN_ID"

      - name: Strip Credential Manifests & Tokens Before Archiving
        if: ${{ always() && env.RUN_ID != '' }}
        run: |
          EVIDENCE_DIR="artifacts/load/${{ env.RUN_ID }}"
          if [ -d "$EVIDENCE_DIR" ]; then
            echo "Removing private credentials manifest (tokens and signing keys) from evidence directory..."
            rm -f "$EVIDENCE_DIR/credentials.json"
          fi

      - name: Upload Test Evidence Artifact
        if: ${{ always() && env.RUN_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: load-evidence-${{ inputs.tier }}p-run-${{ github.run_id }}
          path: artifacts/load/${{ env.RUN_ID }}/
          retention-days: 14
